services:
  - type: web
    name: skillbridge
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: skillbridge-db
    plan: free
    databaseName: skillbridge
    user: skillbridge_user
