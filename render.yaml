services:
  - type: web
    name: skillbridge
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py init_platform && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: EMAIL_BACKEND
        value: config.http_email_backend.HybridEmailBackend
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: trexrifat8@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: "tukb wszr wvtg usxr"
      - key: DEFAULT_FROM_EMAIL
        value: "SkillBridge <trexrifat8@gmail.com>"

databases:
  - name: skillbridge-db
    plan: free
    databaseName: skillbridge
    user: skillbridge_user
